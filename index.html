<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <div class="setimg">
        <div class="search-box">
            <div class="search-bar">
                <input type="text" placeholder="Search city...." id="search">
                <i class="fa-solid fa-magnifying-glass "></i>
            </div>
            <button>Search</button>
        </div>

        <div class="result hidden">
            <h1>Bhubaneswar</h1>
            <div class="img"></div>

            <div class="other-details ">
                <div class="card text-center mb-3 humidity">
                    <div class="card-body">
                        <i class="fa-solid fa-tree"></i>
                        <h5 class="card-title">Humidity</h5>
                        <p class="card-text txt-h">55</p>
                        <!-- <a href="#" class="btn btn2">Go somewhere</a> -->
                    </div>
                </div>
                <div class="card text-center mb-3 temp">
                    <div class="card-body">
                        <i class="fa-solid fa-temperature-low"></i>
                        <h5 class="card-title">Temperature</h5>
                        <p class="card-text txt-t">55</p>
                        <!-- <a href="#" class="btn btn2">Go somewhere</a> -->
                    </div>
                </div>
                <div class="card text-center mb-3 wind">
                    <div class="card-body">
                        <i class="fa-solid fa-wind"></i>
                        <h5 class="card-title ">Wind</h5>
                        <p class="card-text txt-w">55</p>
                        <!-- <a href="#" class="btn btn2">Go somewhere</a> -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
